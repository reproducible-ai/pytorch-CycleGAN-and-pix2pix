name: pix2pix-facades reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag. Adjust commands as needed.

secrets:
  - HF_TOKEN            # wandb->trackio sync + roar put upload

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -m pip install --quiet requests || true
    rm -rf *.egg-info src/*.egg-info
    if command -v uv >/dev/null 2>&1; then
      test "$(uv --version | awk '{{print $1, $2}}')" = "uv 0.12.3"
      echo UV_SOURCE=baked
    else
      curl -fsSL -o /tmp/uv-campaign.tar.gz \
        https://github.com/astral-sh/uv/releases/download/0.12.3/uv-x86_64-unknown-linux-gnu.tar.gz
      echo "600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101  /tmp/uv-campaign.tar.gz" | sha256sum -c -
      tar -xzf /tmp/uv-campaign.tar.gz -C /tmp
      sudo install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
      test "$(/usr/local/bin/uv --version | awk '{{print $1, $2}}')" = "uv 0.12.3"
      echo UV_SOURCE=bootstrapped
    fi
    curl -sS -o /tmp/roar_wheel/roar_cli-0.4.4rc7-cp310-abi3-manylinux_2_34_x86_64.whl --create-dirs "https://test-files.pythonhosted.org/packages/61/98/f7925c6aeba591de9e490bc2b070737e17b5ed948b2cb05ef8b86730537a/roar_cli-0.4.4rc7-cp310-abi3-manylinux_2_34_x86_64.whl"
    echo "7f5321965766eb27462b2931b7961eaf48742109a74f5aa5194a4ba9492f988a  /tmp/roar_wheel/roar_cli-0.4.4rc7-cp310-abi3-manylinux_2_34_x86_64.whl" | sha256sum -c -
    sudo rm -rf /usr/local/lib/python3.10/dist-packages/roar_cli-*.dist-info \
                /usr/local/lib/python3.10/dist-packages/roar \
                /opt/pytorch/lib/python3.12/site-packages/roar_cli-*.dist-info \
                /opt/pytorch/lib/python3.12/site-packages/roar \
                /usr/local/bin/roar /usr/local/bin/roar-worker \
                /opt/pytorch/bin/roar /opt/pytorch/bin/roar-worker \
                /usr/local/lib/python3.10/dist-packages/roar_inject.pth \
                /opt/pytorch/lib/python3.12/site-packages/roar_inject.pth
    # huggingface-hub is required for the publish step's hf:// upload.
    uv tool install --python 3.12.10 --force --with huggingface-hub /tmp/roar_wheel/roar_cli-0.4.4rc7-cp310-abi3-manylinux_2_34_x86_64.whl
    sudo ln -sf /root/.local/bin/roar /usr/local/bin/roar
    test "$(env PATH=/usr/local/bin:/usr/bin:/bin roar --version)" = "roar, version 0.4.4rc7"
    test "$(roar --version | grep -o '[0-9][^ ]*$')" = "0.4.4rc7" || \
      { echo "WRONG ROAR: $(roar --version)"; exit 1; }
    test "$(ls /usr/local/bin/../lib/python3.10/dist-packages/roar/bin 2>/dev/null | wc -l)" != "0" || \
      test "$(ls $(dirname $(readlink -f $(command -v roar)))/../lib/python*/site-packages/roar/bin | wc -l)" -ge 6 || \
      { echo "NO TRACER BINARIES"; exit 1; }
    /usr/local/bin/uv venv --python /opt/pytorch/bin/python /opt/row022-venv
    test -f /opt/row022-venv/pyvenv.cfg
    grep -qx 'include-system-site-packages = false' /opt/row022-venv/pyvenv.cfg
    /usr/local/bin/uv pip install --python /opt/row022-venv/bin/python torch==2.4.0 torchvision==0.19.0 numpy==1.24.3 scikit-image==0.25.2 pillow==11.3.0 dominate==2.9.1 wandb==0.21.1 trackio==0.6.0
    roar --version
    roar tracer use preload
    roar tracer
    roar init || true
  trace: off

fetch_dataset:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PATH=/opt/row022-venv/bin:$PATH

    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n fetch_dataset --wandb-to-trackio -- bash ./datasets/download_pix2pix_dataset.sh facades
  trace: off

train:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PATH=/opt/row022-venv/bin:$PATH

    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n train --wandb-to-trackio -- env TRACKIO_SPACE_ID=reproducible-ai/experiments python train.py --dataroot ./datasets/facades --name row022_facades_pix2pix --model pix2pix --netG unet_256 --direction BtoA --lambda_L1 100 --dataset_mode aligned --norm batch --pool_size 0 --n_epochs 1 --n_epochs_decay 0 --max_dataset_size 8 --num_threads 0 --display_freq 1 --print_freq 1 --save_epoch_freq 1 --no_html --use_wandb --wandb_project_name row022-cyclegan-pix2pix
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact checkpoints/row022_facades_pix2pix/latest_net_G.pth model.name=pix2pix-facades model.version=2026-08-12 license.id='BSD-2-Clause AND BSD-3-Clause' license.name='BSD 2-Clause and BSD 3-Clause licenses' description='Pix2pix conditional GAN trained on paired Facades images' documentation.url='https://github.com/junyanz/pytorch-CycleGAN-and-pix2pix#pix2pix-traintest'
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar status --untracked-dirs
    roar put checkpoints/row022_facades_pix2pix/latest_net_G.pth hf://reproducible-ai/pix2pix-facades --public --yes --no-tag -m "Truncated pix2pix Facades training: 1 epoch over 8 paired images; checkpoint is not converged."
  trace: off
