name: pix2pix-facades reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag. Adjust commands as needed.

secrets:
  - HF_TOKEN            # roar put upload

# Experiment logging is deliberately OFF, and this is a finding, not an oversight.
# Upstream does ship a logging flag (--use_wandb, options/base_options.py:57), but
# util/visualizer.py:70 calls the private wandb API `run._label(repo=...)` on the
# object returned by wandb.init(). No wandb-compatible substitute implements
# `_label`, so enabling the flag raises AttributeError and ends the run. Separately,
# util/visualizer.py:7 imports wandb unconditionally at module import time, so
# aliasing wandb would record the substitute in place of the wandb this repo
# genuinely requires. Both run stages therefore take upstream's own default
# (--use_wandb off) with a real wandb installed, and this row publishes no
# experiment link.

setup:
  command: |
    set -x
    # Preflight: record what this image actually provides before anything depends
    # on it, and hold briefly so this block reaches the log transport even if a
    # later command ends the stage early.
    id; pwd; df -h / | tail -1
    python3 -V || echo "NO python3"
    ls -d /opt/pytorch /opt/pytorch/bin/python 2>/dev/null || echo "NO /opt/pytorch"
    command -v uv >/dev/null 2>&1 && uv --version || echo "NO uv on image"
    command -v roar >/dev/null 2>&1 && roar --version || echo "NO roar on image"
    sudo -n true 2>/dev/null && echo "SUDO: passwordless" || echo "SUDO: unavailable"
    test -n "$HF_TOKEN" && echo "HF_TOKEN: present (${#HF_TOKEN} chars)" || echo "HF_TOKEN: MISSING"
    echo "--- preflight complete ---"
    export PATH=/opt/pytorch/bin:$PATH
    python -m pip install --quiet requests || true
    rm -rf *.egg-info src/*.egg-info
    if command -v uv >/dev/null 2>&1; then
      test "$(uv --version | awk '{print $1, $2}')" = "uv 0.12.3"
      echo UV_SOURCE=baked
    else
      curl -fsSL -o /tmp/uv-campaign.tar.gz \
        https://github.com/astral-sh/uv/releases/download/0.12.3/uv-x86_64-unknown-linux-gnu.tar.gz
      echo "600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101  /tmp/uv-campaign.tar.gz" | sha256sum -c -
      tar -xzf /tmp/uv-campaign.tar.gz -C /tmp
      sudo install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
      test "$(/usr/local/bin/uv --version | awk '{print $1, $2}')" = "uv 0.12.3"
      echo UV_SOURCE=bootstrapped
    fi
    curl -sS -o /tmp/roar_wheel/roar_cli-0.4.4rc7-cp310-abi3-manylinux_2_34_x86_64.whl --create-dirs "https://test-files.pythonhosted.org/packages/61/98/f7925c6aeba591de9e490bc2b070737e17b5ed948b2cb05ef8b86730537a/roar_cli-0.4.4rc7-cp310-abi3-manylinux_2_34_x86_64.whl"
    echo "7f5321965766eb27462b2931b7961eaf48742109a74f5aa5194a4ba9492f988a  /tmp/roar_wheel/roar_cli-0.4.4rc7-cp310-abi3-manylinux_2_34_x86_64.whl" | sha256sum -c -
    sudo rm -rf /usr/local/lib/python3.10/dist-packages/roar_cli-*.dist-info \
                /usr/local/lib/python3.10/dist-packages/roar \
                /opt/pytorch/lib/python3.12/site-packages/roar_cli-*.dist-info \
                /opt/pytorch/lib/python3.12/site-packages/roar \
                /usr/local/bin/roar /usr/local/bin/roar-worker \
                /opt/pytorch/bin/roar /opt/pytorch/bin/roar-worker \
                /usr/local/lib/python3.10/dist-packages/roar_inject.pth \
                /opt/pytorch/lib/python3.12/site-packages/roar_inject.pth
    # huggingface-hub is required for the publish step's hf:// upload.
    uv tool install --python 3.12.10 --force --with huggingface-hub /tmp/roar_wheel/roar_cli-0.4.4rc7-cp310-abi3-manylinux_2_34_x86_64.whl
    sudo ln -sf /root/.local/bin/roar /usr/local/bin/roar
    test "$(env PATH=/usr/local/bin:/usr/bin:/bin roar --version)" = "roar, version 0.4.4rc7"
    test "$(roar --version | grep -o '[0-9][^ ]*$')" = "0.4.4rc7" || \
      { echo "WRONG ROAR: $(roar --version)"; exit 1; }
    test "$(ls /usr/local/bin/../lib/python3.10/dist-packages/roar/bin 2>/dev/null | wc -l)" != "0" || \
      test "$(ls $(dirname $(readlink -f $(command -v roar)))/../lib/python*/site-packages/roar/bin | wc -l)" -ge 6 || \
      { echo "NO TRACER BINARIES"; exit 1; }
    /usr/local/bin/uv venv --python /opt/pytorch/bin/python /opt/row022-venv
    test -f /opt/row022-venv/pyvenv.cfg
    grep -qx 'include-system-site-packages = false' /opt/row022-venv/pyvenv.cfg
    /usr/local/bin/uv pip install --python /opt/row022-venv/bin/python torch==2.4.0 torchvision==0.19.0 numpy==1.26.4 scikit-image==0.25.2 pillow==11.3.0 dominate==2.9.1 wandb==0.21.1
    roar --version
    roar tracer use preload
    roar tracer
    roar init || true
  trace: off

fetch_dataset:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PATH=/opt/row022-venv/bin:$PATH

    export PYTHONUNBUFFERED=1
    roar run -n fetch_dataset -- bash ./datasets/download_pix2pix_dataset.sh facades
  trace: off

train:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PATH=/opt/row022-venv/bin:$PATH

    export PYTHONUNBUFFERED=1
    roar run -n train -- python train.py --dataroot ./datasets/facades --name facades_pix2pix --model pix2pix --direction BtoA --n_epochs 1 --n_epochs_decay 1 --save_epoch_freq 1 --num_threads 0
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact checkpoints/facades_pix2pix/latest_net_G.pth model.name=pix2pix-facades model.version=2026-08-14 license.id='BSD-2-Clause AND BSD-3-Clause' license.name='BSD 2-Clause and BSD 3-Clause licenses' description='pix2pix conditional GAN (UNet-256 generator, 70x70 PatchGAN discriminator) trained on the 400-image CMP Facades paired dataset, labels->photo' documentation.url='https://github.com/junyanz/pytorch-CycleGAN-and-pix2pix#pix2pix-traintest'
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar status --untracked-dirs
    roar put checkpoints/facades_pix2pix/latest_net_G.pth checkpoints/facades_pix2pix/latest_net_D.pth hf://reproducible-ai/pix2pix-facades --public --yes --no-tag -m "pix2pix Facades labels->photo, TRUNCATED to 2 of 200 epochs (1 constant-LR + 1 decay) over all 400 training pairs; checkpoint is NOT converged."
  trace: off
